#
# Same synthetic workspace as test-multibin.yaml, but the background yields
# and uncertainties are NOT given here: they are obtained by fitting
# (fit_bkg : True in the parameter file). That path used to raise a
# NameError before the bin-ordering lists were hoisted out of the
# "read from file" branch.
#
bkgfiles :
    - bkgonly.json
patchsets :
    - [patchset.json, True]
channels :
    -   CRmulti_cuts : 'CR'   # 3 bins
        VRpair_cuts  : 'VR'   # 2 bins
        SRlow_cuts   : 'SR'   # 2 bins
        SRhigh_cuts  : 'SR'   # 1 bin
