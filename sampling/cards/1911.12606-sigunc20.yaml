#
# --- scan limits (TOTAL yields: central value +/- the scan range, i.e. exactly what
# the sampler prints in its "Scan limits" table and stores as
# lower_limits / upper_limits in the run metadata). One entry per
# patchset, in the same order as "patchsets"; null means "compute at
# run time".
#
# Harvested at sig_rel_unc = 0.2. The limits DEPEND on that value,
# because the probe injects the same signal-uncertainty modifier the scan
# uses - do not reuse this block for a different signal uncertainty.
#
# Harvested over ALL bins, with signal leakage enabled everywhere and
# nothing removed, so the box stays valid whatever a later run pins or
# drops; the sampler re-imposes that run's pinning on load.
#
# Harvest context: sig_rel_unc=0.2, signal_leakage_CR_spread=0.5, signal_leakage_VR_spread=0.5, CR_center=obs, VR_center=obs
#
# Generated by tools/harvest_limits.py so the expensive find_min_S probe
# does not have to run again.
#
scan_limits_context :
    # the settings scan_limits was probed with. The sampler recomputes the
    # limits when a run changes sig_rel_unc, or asks for a leakage spread
    # WIDER than the one harvested here.
    sig_rel_unc : 0.2
    signal_leakage_CR_spread : 0.5
    signal_leakage_VR_spread : 0.5
    CR_center : 'obs'
    VR_center : 'obs'

