    - 2.917      # SRHMEM_mct2-1   mCT 230-280   [HEPData t7]
    - 1.120      # SRHMEM_mct2-2   mCT 280-330   [HEPData t7]
    - 8.833      # SRLMEM_mct2-0   mCT 180-230   [HEPData t9]
    - 11.280     # SRLMEM_mct2-1   mCT 230-280   [HEPData t9]
    - 7.281      # SRLMEM_mct2-2   mCT 280-330   [HEPData t9]
