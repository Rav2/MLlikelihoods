#
# ATLAS-SUSY-2019-08 / arXiv:1909.09226
# Electroweakinos -> 1 lepton + h(bb) + MET, 139/fb
#
# The model has 14 BINS, not 8: each of the three signal regions is split into
# three mCT bins ([180,230], [230,280], [280,330] GeV, overflow in the last).
# bkg_yields / bkg_unc are indexed per BIN, in the channel order below, so both
# lists must hold 14 entries. The previous 7 were per-CHANNEL values (as a
# paper quotes them) with TRLMEM_cuts missing.
#
# The values are the POST-FIT background from the ATLAS background-only fit:
# the control regions alone constrain mu_Top / mu_W / mu_ST and the signal
# regions are extrapolated. The nominal sum over the workspace samples is a
# PRE-FIT number and does not match the paper (SR-MM: 9.57 pre-fit vs 8.62
# post-fit). Fitting all regions at once is also wrong - the SR excess then
# pulls the very normalisation factors that predict it, giving SR-HM 12.7.
#
# Signal regions: the published numbers, from HEPData record ins1755298
#   tables t7/t8/t9 (dataMC_SR{HM,LM,MM}_mct, "Expected background",
#   sys (x) stat). tools/postfit_yields.py reproduces them from the likelihood
#   to within 0.09%; tools/validate_vs_hepdata.py runs that comparison.
#
# Control regions: HEPData publishes no per-CR yields for this analysis, so
#   these come from the same reproduced CR-only fit. That is harmless here: a
#   CR bin's central value is its OBSERVED yield and its scan range is
#   +/- obs * signal_leakage_CR_spread, so get_scan_limits never uses a CR
#   entry of bkg_yields. They are kept for the printed table and the metadata.
#
bkgfiles :
    - BkgOnly.json
patchsets :
    - patchset.json
channels :
    -  SRHMEM_mct2 : 'SR'
       SRLMEM_mct2 : 'SR'
       SRMMEM_mct2 : 'SR'
       STCREM_cuts : 'CR'
       TRHMEM_cuts : 'CR'
       TRLMEM_cuts : 'CR'
       TRMMEM_cuts : 'CR'
       WREM_cuts : 'CR'
bkg_yields :
