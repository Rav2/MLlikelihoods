#
# Synthetic analysis used to exercise the sampler. Deliberately mixes
# multi-bin and single-bin channels, and lists the channels in a DIFFERENT
# order than the model does (the model sorts them alphabetically), so the
# bin-reordering logic in sample.py is exercised too.
#
bkgfiles :
    - bkgonly.json
patchsets :
    - [patchset.json, True]
channels :
    -   CRmulti_cuts : 'CR'   # 3 bins
        VRpair_cuts  : 'VR'   # 2 bins
        SRlow_cuts   : 'SR'   # 2 bins
        SRhigh_cuts  : 'SR'   # 1 bin
# yields follow the channel order above: 3 + 2 + 2 + 1 = 8 bins
bkg_yields :
    - 120.0
    - 90.0
    - 60.0
    - 40.0
    - 25.0
    - 8.0
    - 5.0
    - 3.0
bkg_unc :
    - 12.0
    - 9.0
    - 6.0
    - 4.0
    - 2.5
    - 0.8
    - 0.5
    - 0.3
