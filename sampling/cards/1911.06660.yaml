# These follow the channel order declared above - QCR1, QCR2, SR1, SR2, WCR -
# which is also the workspace's order. The published table (HEPData
# ins1765529 t18) lists the regions as QCR1, QCR2, WCR, SR1, SR2 instead;
# copying from there without reordering puts WCR's +/-33 onto SR1, where a
# background of 6.0 then trips the 3*sqrt(B) clip and the SR1 scan box opens
# all the way down to zero background. That is what used to be here.
bkg_unc :
    - 8.0
    - 5.0
    - 2.9
    - 2.0
    - 33.0
#
# --- scan limits (TOTAL yields: central value +/- the scan range, i.e. exactly what
# the sampler prints in its "Scan limits" table and stores as
# lower_limits / upper_limits in the run metadata). One entry per
# patchset, in the same order as "patchsets"; null means "compute at
# run time".
#
# Harvested at sig_rel_unc = 0.0. The limits DEPEND on that value,
# because the probe injects the same signal-uncertainty modifier the scan
# uses - do not reuse this block for a different signal uncertainty.
#
# Harvested over ALL bins, with signal leakage enabled everywhere and
# nothing removed, so the box stays valid whatever a later run pins or
# drops; the sampler re-imposes that run's pinning on load.
#
# Harvest context: sig_rel_unc=0.0, signal_leakage_CR_spread=0.1, signal_leakage_VR_spread=0.1, CR_center=obs, VR_center=obs, low_lim_samples=8
#
# Generated by tools/harvest_limits.py so the expensive find_min_S probe
# does not have to run again.
#
scan_limits_context :
    # The settings scan_limits was probed with. The sampler recomputes the
    # limits when a run changes sig_rel_unc, or asks for a leakage spread
    # WIDER than the one harvested here.
    # REQUIRED: without this block, or without a setting the run depends
    # on, the limits cannot be verified and are recomputed.
    # low_lim_samples is the bisection RESOLUTION, not a validity condition:
    # a run asking for more of them still uses these limits, but is warned
    # that the floors were resolved on a coarser grid.
    sig_rel_unc : 0.0
    signal_leakage_CR_spread : 0.1
    signal_leakage_VR_spread : 0.1
    CR_center : 'obs'
    VR_center : 'obs'
    low_lim_samples : 8

scan_limits :
    # Region-combined/patchset.json: 5 bins, same channel order as "channels" above
    #   source: results-BkgOnly-patchset-0.json (seed 1787799923)
    -
        - [64.8001, 79.2]   # QCR1cut_cuts-0
        - [24.3001, 29.7]   # QCR2cut_cuts-0
        - [2.9001, 24.5]   # SR1cut_cuts-0
        - [2.0001, 17]   # SR2cut_cuts-0
        - [989.1001, 1208.9]   # WCRcut_cuts-0
