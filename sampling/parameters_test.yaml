#
# Regression parameter file for the sampling code.
#
# Every document below deliberately drives a code path that was broken
# before the fix pass. Runs in a couple of minutes on a laptop; the point
# is coverage, not statistics, so the point counts are tiny.
#
#   run with:  python sample.py parameters_test.yaml
#
---
# ------------------------------------------------------------------ globals
analyses :
    - 'test-multibin'
    - 'test-fitbkg'
    - '1912.08479'
input_folder : '../data/'
# throwaway location on purpose: the regression run must never write into the
# real ../tables/ tree next to the production scans
output_folder : '/tmp/mll-sampling-test/'
processes : 1
scans : 1
points : 6
bkg_unc_samples : 200
low_lim_samples : 5
buffer_size : 4
keep_files : True
cluster : False
spey_verbose_lvl : 0
---
# ---------------------------------------------------------- 1. multi-bin +
# channel removal + 'default' starting points with scans > 3 + random criterion
#
# covers: per-BIN channel-removal mask (CRmulti_cuts holds 3 bins, so the
#         output must lose exactly 3 columns), the populate_randomly()
#         signature in start_method 'default', the criterion returned by
#         np.random.choice, the signal-uncertainty (histosys) branch, and
#         a buffer flush in the middle of a scan (buffer_size < points).
analysis : 'test-multibin'
include : cards/test-multibin.yaml
scans : 4
processes : 2
points : 6
buffer_size : 4
low_lim_samples : 5
start_method : 'default'
scan_criterion : 'mu1'
sig_rel_unc : 0.15
signal_leakage_CR : False
signal_leakage_VR : False
removeCRsVRs : False
remove_channels :
    - CRmulti_cuts
---
# --------------------------------------------------- 2. fitted background +
# signal leakage in CRs and VRs + 'edges' starting points
#
# covers: the fit_bkg branch (used to die with a NameError on
#         input_bins_ordered), VR handling with VR_center 'exp', and the
#         edge-based starting points.
analysis : 'test-fitbkg'
include : cards/test-fitbkg.yaml
scans : 3
processes : 2
points : 5
buffer_size : 10
low_lim_samples : 5
fit_bkg : True
bkg_unc_samples : 200
start_method : 'edges'
scan_criterion : 'nLL_exp_mu1'
signal_leakage_CR : True
signal_leakage_CR_spread : 0.15
signal_leakage_VR : True
signal_leakage_VR_spread : 0.15
VR_center : 'exp'
CR_center : 'obs'
SR_sigma : 0.05
CR_sigma : 0.02
VR_sigma : 0.02
---
# ------------------------------------------- 3. a real, small ATLAS analysis
#
# covers: the ordinary end-to-end path on real input (ATLAS-SUSY-2018-06),
#         with 'default' starting points in the n <= 3 branch.
analysis : '1912.08479'
include : cards/1912.08479.yaml
scans : 2
processes : 2
points : 5
buffer_size : 10
low_lim_samples : 3
start_method : 'default'
scan_criterion : 'nLL_obs_mu1'
